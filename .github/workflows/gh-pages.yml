name: github pages

on:
    push:
        branches:
            - doc
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v5
              # 不指定 version：自动读取 package.json 的 packageManager 字段（pnpm@11.22.0），
              # 避免与仓库实际使用的 pnpm 版本不一致导致 pnpm 不在 PATH 中。

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile
              env:
                  HUSKY: 0

            - name: Build documentation
              run: pnpm docs:build
              env:
                  NODE_ENV: production

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: docs-dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
